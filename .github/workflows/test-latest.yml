name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        swift-image:
          - swift:6.2-noble
          - swift:6.3-noble
          - swift:6.4-noble
    container:
      image:  ${{ matrix.swift-image }}
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set DEBUG specific environment variables
      if: runner.debug == '1'
      run: |
        echo "LOG_LEVEL=trace" >> "$GITHUB_ENV"
    - name: Install zstd
      run: |
        apt-get update -y
        apt-get install -y zstd
    - name: Restore .build
      id: "restore-build"
      uses: actions/cache/restore@v4
      with:
        path: .build
        key: "${{ matrix.swift-image }}-swiftpm-tests-build-${{ runner.os }}-${{ github.event.pull_request.base.sha || github.event.after }}"
        restore-keys: "${{ matrix.swift-image }}-swiftpm-tests-build-${{ runner.os }}-"
    - name: Build
      run: swift build --build-tests --enable-code-coverage
    - name: Cache .build
      if: steps.restore-build.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: .build
        key: "${{ matrix.swift-image }}-swiftpm-tests-build-${{ runner.os }}-${{ github.event.pull_request.base.sha || github.event.after }}"
    - name: Run tests
      run: swift test --skip-build --enable-code-coverage
      env:
        PSQL_HOST: postgres
        PSQL_PORT: 5432
        PSQL_USER: postgres
        PSQL_PASSWORD: postgres
        PSQL_DATABASE: postgres
    - name: Prepare Code Coverage
      shell: bash
      run: |
        BIN_PATH="$(swift build --build-tests --show-bin-path)"
        
        PROFDATA_PATH="$(dirname "$(swift test --show-codecov-path)")/default.profdata"
        
        COV_ARGS=()
        
        if [[ -d "${BIN_PATH}/postgres-nio-macrosPackageTests.xctest" ]]; then
          COV_ARGS+=("--object=${BIN_PATH}/postgres-nio-macrosPackageTests.xctest/Contents/macOS/postgres-nio-macrosPackageTests")
        
        elif [[ -x "${BIN_PATH}/postgres-nio-macrosPackageTests.xctest" ]]; then
          COV_ARGS+=("--object=${BIN_PATH}/postgres-nio-macrosPackageTests.xctest")
        
        else
          for obj in "${BIN_PATH}/"*"-test-runner"; do
            if [[ -f "$obj" ]]; then
              SHARED_LIB="${obj/-test-runner/.so}"
              COV_ARGS+=("--object=${SHARED_LIB}")
            fi
          done
        fi
        
        if [ ${#COV_ARGS[@]} -eq 0 ]; then
          echo "No coverage binaries found in $BIN_PATH:"
          ls -la "$BIN_PATH"
          exit 1
        fi
        
        llvm-cov export -format="lcov" \
          "${COV_ARGS[@]}" \
          -ignore-filename-regex="\/Tests\/" \
          -instr-profile "$PROFDATA_PATH" > info.lcov
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: info.lcov
